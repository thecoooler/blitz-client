[package]
name = "blitz-mod-installer"
version = "0.1.0"
edition = "2024"
description = "Tanks Blitz resource mod installer"
license = "MIT"

[lib]
name = "blitz_mod_installer"
path = "src/lib.rs"

[[bin]]
name = "blitz-mod"
path = "src/main.rs"

[dependencies]
crc32fast = "1.5"
miniz_oxide = "0.9.1"
lz4_flex = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
toml_edit = "0.22"
