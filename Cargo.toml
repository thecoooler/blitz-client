[package]
name = "blitz-mod-installer"
version = "0.1.0"
edition = "2024"
description = "Tanks Blitz client analysis and resource mod tools"
license = "MIT"

[lib]
name = "blitz_mod_installer"
path = "src/lib.rs"

[[bin]]
name = "blitz-client"
path = "src/main.rs"

[dependencies]
crc32fast = "1.5"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
lz4_flex = "0.11"
miniz_oxide = "0.9.1"
serde = { version = "1.0", features = ["derive"] }
serde-pickle = "1.2.0"
serde_json = "1.0"
toml = "0.8"
toml_edit = "0.22"
wotbreplay-parser = { version = "0.4.2", features = ["raw-payload"] }
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }
