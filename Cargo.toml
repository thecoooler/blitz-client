[package]
name = "blitz-client"
version = "0.1.0"
edition = "2024"
description = "Tanks Blitz client analysis and resource mod tools"
license = "MIT"

[lib]
name = "blitz_client"
path = "src/lib.rs"

[[bin]]
name = "blitz-client"
path = "src/cli/main.rs"
required-features = ["cli"]

[[example]]
name = "replay_follow"
required-features = ["replay"]

[[example]]
name = "client_catalog"
required-features = ["client"]

[[example]]
name = "decode_resource"
required-features = ["resources"]

[features]
default = ["cli"]
resources = ["dep:crc32fast", "dep:lz4_flex", "dep:miniz_oxide"]
client = ["resources", "dep:serde_json"]
export = ["client"]
mods = ["client", "dep:serde_json", "dep:toml", "dep:toml_edit"]
replay = ["dep:flate2", "dep:serde_json", "dep:serde-pickle", "dep:prost", "dep:serde_bytes", "dep:zip"]
cli = ["export", "mods", "replay"]

[dependencies]
crc32fast = { version = "1.5", optional = true }
flate2 = { version = "1", default-features = false, features = ["rust_backend"], optional = true }
lz4_flex = { version = "0.11", optional = true }
miniz_oxide = { version = "0.9.1", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde-pickle = { version = "1.2.0", optional = true }
serde_json = { version = "1.0", optional = true }
toml = { version = "0.8", optional = true }
toml_edit = { version = "0.22", optional = true }
prost = { version = "0.11.9", optional = true }
serde_bytes = { version = "0.11", optional = true }
zip = { version = "0.6.6", default-features = false, features = ["deflate"], optional = true }
